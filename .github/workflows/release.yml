name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    # Use macOS runner so we have the headers for the Darwin CGO build.
    # It can also cross-compile the Linux builds since we disabled CGO for Linux.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Apply curated release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="changelog/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file "$notes"
            echo "Applied curated release notes from $notes"
          else
            echo "No curated notes at $notes; leaving GoReleaser's generated notes."
          fi
